     Netlify hosting facts for this site: static/SSR served via Netlify Edge. --><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#24123f"><title>MYWORKING · 图片揭晓游戏</title>
<style>
:root{--purple:#6d39a8;--ink:#20172c;--gold:#ffd15c;--rose:#fb6668;--paper:#fffaf2}*{box-sizing:border-box}body{margin:0;font-family:system-ui,"Microsoft YaHei",sans-serif;color:var(--ink);background:radial-gradient(circle at 10% 0,#60329a 0,transparent 34%),radial-gradient(circle at 95% 100%,#a83268 0,transparent 36%),linear-gradient(135deg,#211239,#442361 58%,#1d1534);min-height:100vh}button,input{font:inherit}button{border:0;cursor:pointer}.shell{max-width:1100px;margin:auto;padding:18px}.brand{color:#fff;font-weight:900;letter-spacing:.12em}.brand span{color:var(--gold)}.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.panel{background:rgba(255,250,242,.97);border:1px solid #fff;border-radius:22px;box-shadow:0 16px 45px #120a2448;padding:20px}.setup h1{margin:.25em 0}.muted{color:#776c80}.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}.btn{border-radius:14px;padding:12px 17px;font-weight:800;background:var(--purple);color:#fff}.btn.gold{background:var(--gold);color:#362344}.btn.light{background:#eee8f4;color:#3b2c4d}.btn.red{background:#c74053}.btn:disabled{opacity:.45;cursor:not-allowed}textarea{width:100%;min-height:120px;border:2px dashed #c7b4dc;border-radius:14px;padding:12px;background:#fffdfb}input[type=file]{max-width:100%}.items{display:grid;gap:10px;margin:15px 0}.item{display:grid;grid-template-columns:86px 1fr auto;gap:12px;align-items:center;background:white;padding:9px;border-radius:14px;border:1px solid #e7deec}.thumb{width:86px;height:70px;object-fit:cover;border-radius:10px}.ans{width:100%;font-size:18px;border:1px solid #d9cddd;border-radius:10px;padding:10px}.stage{display:none;min-height:100dvh;position:relative;overflow:hidden;background:radial-gradient(ellipse at bottom,#ffdc71 0 5%,transparent 5.5%),linear-gradient(#2f1853 0 56%,#813792 56% 70%,#f9a046 70%);color:white}.stage::before,.stage::after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(110deg,transparent 0 6%,#ffffff10 6.2% 6.6%,transparent 7% 12%);animation:run 1.3s linear infinite}.stage::after{opacity:.35;animation-duration:2s;transform:scaleX(-1)}@keyframes run{to{background-position:170px 0}}.gamebar{position:relative;z-index:2;display:flex;justify-content:space-between;align-items:center;padding:14px clamp(12px,3vw,32px);gap:10px}.pill{background:#241239d9;color:#fff;border:1px solid #ffffff55;border-radius:999px;padding:8px 13px;font-weight:800}.play{position:relative;z-index:1;min-height:calc(100dvh - 62px);display:flex;flex-direction:column;align-items:center;padding:1vh 3vw 3vh}.question{width:min(680px,86vw);height:min(24vh,200px);min-height:104px;border-radius:20px;background:linear-gradient(145deg,#fffefb,#fff3d0);border:5px solid var(--gold);color:#2d1b38;display:grid;place-items:center;text-align:center;padding:18px;font-size:clamp(24px,5vw,48px);font-weight:950;box-shadow:0 12px 0 #9e4a37aa,0 20px 40px #16092177;margin:1vh auto 2vh;position:relative}.question img{max-width:100%;max-height:100%;object-fit:contain}.qtime{width:min(680px,86vw);height:32px;background:#180e29d9;border:2px solid #fff8;border-radius:99px;position:relative;margin-bottom:1.4vh;overflow:hidden}.qfill{height:100%;width:100%;background:linear-gradient(90deg,#ffca49,#ff735b);transition:width .2s}.qleft{position:absolute;inset:0;display:grid;place-items:center;font-weight:900;text-shadow:0 1px 3px #3a1b24}.answers{display:flex;justify-content:center;gap:10px;margin:1vh 0;flex-wrap:wrap}.answer{font-size:clamp(18px,3vw,26px);font-weight:900;padding:12px 22px;border-radius:15px;background:#fff5dd;color:#392043;border:3px solid #ffd15c;box-shadow:0 5px 0 #a94453}.answer.good{background:#58db88}.answer.bad{background:#ff6573}.quizcard{width:min(900px,94vw);background:#fffaf0f3;color:#251a31;border-radius:22px;padding:clamp(12px,3vw,24px);box-shadow:0 20px 40px #10081f88}.foot{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:auto}.big{font-size:clamp(26px,7vw,64px);font-weight:1000;text-align:center;text-shadow:0 4px 0 #532239;margin:8px}.scorefloat{position:fixed;z-index:8;left:50%;top:40%;transform:translate(-50%,-50%);font-size:clamp(46px,12vw,100px);font-weight:1000;animation:float .95s forwards;pointer-events:none}.scorefloat.minus{color:#ff555c}.scorefloat.plus{color:#51ff9b}@keyframes float{0%{opacity:0;scale:.4}20%{opacity:1;scale:1.15}100%{opacity:0;transform:translate(-50%,-170%) scale(.9)}}.confetti{position:fixed;inset:0;pointer-events:none;z-index:7}.hidden{display:none!important}.line{height:2px;background:#e9dfed;margin:16px 0}.two{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}@media(max-width:600px){.shell{padding:12px}.panel{padding:15px}.item{grid-template-columns:64px 1fr auto}.thumb{width:64px;height:58px}.gamebar{padding:10px}.question{width:94vw;height:20vh}.qtime{width:94vw}.quizcard{width:96vw}.answers{gap:8px}}
</style></head><body>
<div class="shell" id="editor"><div class="head"><div class="brand">MY<span>WORKING</span></div><button class="btn light" onclick="openHelp()">使用说明</button></div><section class="panel setup"><h1>🖼️ 图片逐步揭晓</h1><p class="muted">一次加入多张图片、填写答案；上课时按顺序切换，不用每张图重新生成网页。答题前显示“这是什么？”，揭晓后显示大字答案，也可朗读。</p><div class="row"><label class="btn light" for="files">选择多张图片</label><input id="files" type="file" accept="image/*" multiple hidden><button class="btn light" id="clear">清空图片</button><span id="count" class="muted">尚未添加图片</span></div><div id="items" class="items"></div><div class="line"></div><h3>揭晓方式</h3><div class="row"><label><input type="radio" name="mode" value="random" checked> 随机逐块揭晓</label><label><input type="radio" name="mode" value="expand"> 从中心方块向外扩大</label><label>网格密度 <select id="grid"><option value="6">6 × 6</option><option value="8" selected>8 × 8</option><option value="10">10 × 10</option><option value="12">12 × 12</option></select></label><label><input type="checkbox" id="sound" checked> 音效</label></div><div class="line"></div><div class="row"><button class="btn gold" id="start">进入课堂大屏</button><button class="btn light" id="save">保存本机题库</button><button class="btn light" id="load">载入本机题库</button></div><p class="muted">题库图片保存在本机浏览器。若换手机或清除浏览器数据，请重新导入图片。</p></section></div>
<main class="stage" id="stage"><div class="gamebar"><button class="pill" id="exit">✕ 设置</button><span class="pill" id="progress">第 1 / 1 张</span><div class="row"><button class="pill" id="soundToggle">🔊 音效</button><button class="pill" id="fullscreen">⛶ 全屏</button></div></div><div class="play"><div class="question" id="prompt">这是什么？</div><div class="qtime"><div class="qfill" id="qfill"></div><div class="qleft" id="qleft">按一下揭开一部分</div></div><div class="quizcard"><div class="two"><div id="caption">这是什么？</div><div class="pill" id="revealed">0%</div></div><div id="canvas" style="position:relative;aspect-ratio:4/3;width:100%;max-height:54dvh;margin:12px auto;border:4px solid #30203e;border-radius:16px;overflow:hidden;background:#140e20"><img id="photo" style="width:100%;height:100%;object-fit:contain;display:block"><div id="tiles" style="position:absolute;inset:0;display:grid;pointer-events:none"></div></div><div class="big hidden" id="answer"></div><div class="foot"><button class="btn light" id="prev">← 上一张</button><button class="btn gold" id="step">揭开一块</button><button class="btn" id="show">揭晓答案</button><button class="btn light" id="next">下一张 →</button><button class="btn red" id="again">重新开始本张</button><button class="btn light hidden" id="speak">🔊 朗读答案</button></div></div></div></main>
<script>
(()=>{const $=s=>document.querySelector(s),items=$('#items');let cards=[],idx=0,opened=new Set(),tiles=[],audio=true,ctx;const beep=(f=520,d=.08)=>{if(!audio)return;try{ctx=ctx||new(window.AudioContext||window.webkitAudioContext)();let o=ctx.createOscillator(),g=ctx.createGain();o.frequency.value=f;o.type='sine';g.gain.value=.055;o.connect(g);g.connect(ctx.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+d);o.stop(ctx.currentTime+d)}catch{}};const titleFor=()=>{const x=cards[idx];return x?.answer||'这是什么？'};function drawEditor(){items.innerHTML='';cards.forEach((x,i)=>{let d=document.createElement('div');d.className='item';d.innerHTML=`<img class="thumb" src="${x.src}"><input class="ans" placeholder="第 ${i+1} 张的答案" value="${esc(x.answer)}"><button class="btn red">移除</button>`;d.querySelector('input').oninput=e=>cards[i].answer=e.target.value;d.querySelector('button').onclick=()=>{cards.splice(i,1);drawEditor()};items.append(d)});$('#count').textContent=cards.length?`已添加 ${cards.length} 张图片`:'尚未添加图片'}function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}$('#files').onchange=async e=>{for(const f of [...e.target.files]){const src=await shrink(f);cards.push({src,answer:''})}e.target.value='';drawEditor()};function shrink(file){return new Promise(resolve=>{let r=new FileReader();r.onload=()=>{let im=new Image();im.onload=()=>{let scale=Math.min(1,1800/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*scale);c.height=Math.round(im.height*scale);c.getContext('2d').drawImage(im,0,0,c.width,c.height);resolve(c.toDataURL('image/jpeg',.88))};im.src=r.result};r.readAsDataURL(file)})}$('#clear').onclick=()=>{if(confirm('清空已选图片？')){cards=[];drawEditor()}};$('#save').onclick=()=>{try{localStorage.setItem('mwRevealDeck',JSON.stringify(cards));alert('已保存到本机浏览器。')}catch(e){alert('图片数据较多，浏览器空间不足；请减少图片或压缩图片。')}};$('#load').onclick=()=>{try{cards=JSON.parse(localStorage.getItem('mwRevealDeck')||'[]');drawEditor()}catch{alert('没有可载入的题库。')}};function start(){if(!cards.length)return alert('请先选择至少一张图片。');audio=$('#sound').checked;$('#editor').style.display='none';$('#stage').style.display='block';idx=0;render()}function render(){const c=cards[idx];if(!c)return;opened=new Set();$('#photo').src=c.src;$('#answer').classList.add('hidden');$('#speak').classList.add('hidden');$('#caption').textContent='这是什么？';$('#progress').textContent=`第 ${idx+1} / ${cards.length} 张`;let n=+$('#grid').value,mode=document.querySelector('[name=mode]:checked').value;let box=$('#tiles');box.innerHTML='';box.style.gridTemplateColumns=`repeat(${n},1fr)`;box.style.gridTemplateRows=`repeat(${n},1fr)`;tiles=[];for(let y=0;y<n;y++)for(let x=0;x<n;x++){let d=document.createElement('div');d.style.cssText='background:#221933;border:1px solid #ffffff18;transition:opacity .18s';d.dataset.x=x;d.dataset.y=y;box.append(d);tiles.push(d)}if(mode==='expand'){const cx=(n-1)/2,cy=(n-1)/2;tiles.sort((a,b)=>Math.abs(+a.dataset.x-cx)+Math.abs(+a.dataset.y-cy)-Math.abs(+b.dataset.x-cx)-Math.abs(+b.dataset.y-cy))}$('#qleft').textContent='按一下揭开一部分';$('#qfill').style.width='100%';$('#revealed').textContent='0%';$('#step').textContent='揭开一块';$('#prompt').textContent='这是什么？'}function reveal(){if(opened.size>=tiles.length)return;const mode=document.querySelector('[name=mode]:checked').value;let candidates=tiles.filter(t=>!opened.has(t));let chosen=mode==='random'?candidates[Math.floor(Math.random()*candidates.length)]:candidates[0];if(mode==='random')opened.add(chosen);else{let batch=Math.max(1,Math.ceil(tiles.length/18));for(let i=0;i<batch&&candidates[i];i++)opened.add(candidates[i])}if(mode==='random')chosen.style.opacity='0';else [...opened].forEach(x=>x.style.opacity='0');let pct=Math.round(opened.size/tiles.length*100);$('#revealed').textContent=pct+'%';$('#qfill').style.width=(100-pct)+'%';$('#qleft').textContent=pct===100?'图片已完全揭晓':`已揭晓 ${pct}%`;beep(520+pct*3,.07);if(pct>=100){$('#answer').textContent=titleFor();$('#answer').classList.remove('hidden');$('#caption').textContent=titleFor();$('#speak').classList.remove('hidden');$('#prompt').textContent=titleFor();beep(880,.17);setTimeout(()=>beep(1120,.18),130)}}$('#step').onclick=reveal;$('#show').onclick=()=>{while(opened.size<tiles.length)reveal();$('#answer').textContent=titleFor();$('#answer').classList.remove('hidden');$('#speak').classList.remove('hidden')};$('#next').onclick=()=>{if(idx<cards.length-1){idx++;render()}else alert('已经是最后一张。')};$('#prev').onclick=()=>{if(idx>0){idx--;render()}};$('#again').onclick=render;$('#exit').onclick=()=>{speechSynthesis?.cancel();$('#stage').style.display='none';$('#editor').style.display='block'};$('#soundToggle').onclick=()=>{audio=!audio;$('#soundToggle').textContent=audio?'🔊 音效':'🔇 音效'};$('#fullscreen').onclick=()=>{if(!document.fullscreenElement)document.documentElement.requestFullscreen?.();else document.exitFullscreen?.()};$('#speak').onclick=()=>{if(!('speechSynthesis'in window))return alert('当前浏览器不支持语音朗读。');let u=new SpeechSynthesisUtterance(titleFor());u.lang='zh-CN';u.rate=.86;speechSynthesis.cancel();speechSynthesis.speak(u)};$('#start').onclick=start;window.addEventListener('keydown',e=>{if($('#stage').style.display!=='block')return;if(e.code==='Space'||e.code==='ArrowDown'){e.preventDefault();reveal()}if(e.code==='ArrowRight')$('#next').click();if(e.code==='ArrowLeft')$('#prev').click();if(e.key==='Enter')$('#show').click()});window.openHelp=()=>alert('先选择多张图片并填写每张答案，再进入课堂大屏。空格键/点击“揭开一块”逐步显示；左右方向键或上一张/下一张切换图片；揭晓后可朗读答案。页面会将图片缩放压缩后保存到本机浏览器。');drawEditor()})();
</script></body></html>
